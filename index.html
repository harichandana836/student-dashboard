<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Dashboard</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="container">
<h1>🎓 Student Dashboard</h1>
<p class="subtitle">Manage and visualize student performance</p>
<div class="stats">
<div class="card">
<h3>Total Students</h3>
<p id="totalStudents">0</p>
</div>
<div class="card">
<h3>Average Marks</h3>
<p id="avgMarks">0</p>
</div>
<div class="card">
<h3>Top Grade</h3>
<p id="topGrade">-</p>
</div>
</div>
<div class="input-section">
<input type="text" id="name" placeholder="Student Name">
<input type="text" id="studentId" placeholder="Roll Number">
<input type="number" id="marks" placeholder="Marks">
<button onclick="addStudent()">Add Student</button>
</div>
<input type="text" id="search" placeholder="Search student..." onkeyup="searchStudent()">
<table>
<thead>
<tr>
<th>Name</th>
<th>Roll No</th>
<th>Marks</th>
<th>Grade</th>
<th>Action</th>
</tr>
</thead>
<tbody id="studentTable"></tbody>
</table>
<canvas id="chart"></canvas>
</div>
<script src="script.js"></script>
</body>
</html>
